name: Claude Code

on:
  workflow_dispatch:  # Disable except manual activetion
#on:
#  issue_comment:
#    types: [created]
#  pull_request_review_comment:
#    types: [created]
#  issues:
#    types: [opened, assigned]
#  pull_request_review:
#    types: [submitted]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash(gh run list*),Bash(gh run view*)"
          claude_args: |
            --system-prompt "
            When posting GitHub comments, drafting Issues and making PRs:
            - Use '#NN' ONLY for intentional references to real issues/PRs.
            - For item numbering, step numbering, or placeholders, do NOT use
              '#NN'. Use 'item N' without the #, or wrap in backticks: \`#N\`.
            - When uncertain, wrap in backticks to be safe.
            "
